<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hoops · Edit step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#00AAAA}a:hover{color:#007777}
</style>
</helmet>
<div style="width:600px;height:500px;position:relative;overflow:hidden;background:#E9EAEC;font-family:'Barlow',sans-serif;color:#16181B">
<div style="position:absolute;left:205px;top:0;width:190px;height:500px;border-radius:28px;background:#1B1C1E"></div>
<div style="position:absolute;left:131px;top:114px;width:18px;height:48px;border-radius:6px;background:#3A3D41;transform:rotate(35deg)"></div>
<div style="position:absolute;left:131px;top:338px;width:18px;height:48px;border-radius:6px;background:#3A3D41;transform:rotate(-35deg)"></div>
<div style="position:absolute;left:451px;top:114px;width:18px;height:48px;border-radius:6px;background:#3A3D41;transform:rotate(-35deg)"></div>
<div style="position:absolute;left:451px;top:338px;width:18px;height:48px;border-radius:6px;background:#3A3D41;transform:rotate(35deg)"></div>
<div style="position:absolute;left:110px;top:60px;width:380px;height:380px;border-radius:50%;background:#26282B;box-shadow:0 18px 40px rgba(0,0,0,0.35)"></div>
<div style="position:absolute;left:121px;top:146px;width:80px;text-align:center;font-size:11px;font-weight:600;letter-spacing:0.12em;color:#B8BBBF;transform:rotate(-55deg)">UP</div>
<div style="position:absolute;left:121px;top:340px;width:80px;text-align:center;font-size:11px;font-weight:600;letter-spacing:0.12em;color:#B8BBBF;transform:rotate(55deg)">DOWN</div>
<div style="position:absolute;left:399px;top:146px;width:80px;text-align:center;font-size:11px;font-weight:600;letter-spacing:0.12em;color:#B8BBBF;transform:rotate(55deg)">SELECT</div>
<div style="position:absolute;left:399px;top:340px;width:80px;text-align:center;font-size:11px;font-weight:600;letter-spacing:0.12em;color:#B8BBBF;transform:rotate(-55deg)">BACK</div>

<div style="position:absolute;left:150px;top:100px;width:300px;height:300px;border-radius:50%;background:#000000;overflow:hidden;color:#FFFFFF">
<div style="position:absolute;left:258px;top:66px;width:10px;height:10px;border-radius:50%;background:#FFFFFF"></div>
<div style="position:absolute;left:258px;top:224px;width:10px;height:10px;border-radius:50%;background:#FFFFFF"></div>
<div style="position:absolute;left:32px;top:66px;width:10px;height:10px;border-radius:50%;background:#FFFFFF"></div>
<div style="position:absolute;left:32px;top:224px;width:10px;height:10px;border-radius:50%;background:#FFFFFF"></div>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
<div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:0.2em;color:#00AAAA">NEW STEP 3</div>
<div style="width:190px;display:flex;justify-content:space-between;font-size:15px;color:#AAAAAA"><span>Spot</span><span style="color:#FFFFFF;font-weight:600">Free Throw</span></div>
<div style="width:190px;display:flex;justify-content:space-between;font-size:15px;color:#AAAAAA"><span>Goal</span><span style="color:#FFFFFF;font-weight:600">Attempts</span></div>
<div style="width:190px;box-sizing:border-box;margin-top:4px;padding:4px 0 6px;border:2px solid #00AAAA;border-radius:18px;display:flex;flex-direction:column;align-items:center">
<svg width="18" height="10" viewBox="0 0 18 10" fill="#00AAAA"><path d="M9 0l9 10H0z"></path></svg>
<div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:56px;line-height:1">10</div>
<div style="font-size:14px;font-weight:600;color:#AAAAAA;margin-top:-2px">shots</div>
<svg width="18" height="10" viewBox="0 0 18 10" fill="#00AAAA"><path d="M0 0h18L9 10z"></path></svg>
</div>
<div style="width:190px;display:flex;justify-content:space-between;font-size:15px;color:#AAAAAA;margin-top:4px"><span>Rest</span><span>30 s</span></div>
</div>
</div>

<div style="position:absolute;left:4px;top:112px;width:112px;text-align:right">
<div style="font-size:11px;font-weight:600;letter-spacing:0.12em;color:#5F6268">UP</div>
<div style="font-size:16px;font-weight:700;line-height:1.2;margin-top:3px">+5</div>
</div>
<div style="position:absolute;left:4px;top:336px;width:112px;text-align:right">
<div style="font-size:11px;font-weight:600;letter-spacing:0.12em;color:#5F6268">DOWN</div>
<div style="font-size:16px;font-weight:700;line-height:1.2;margin-top:3px">−5</div>
</div>
<div style="position:absolute;left:484px;top:112px;width:112px">
<div style="font-size:11px;font-weight:600;letter-spacing:0.12em;color:#5F6268">SELECT</div>
<div style="font-size:16px;font-weight:700;line-height:1.2;margin-top:3px">Next field</div>
<div style="font-size:12px;color:#5F6268;margin-top:2px">after Rest: add step / save</div>
</div>
<div style="position:absolute;left:484px;top:336px;width:112px">
<div style="font-size:11px;font-weight:600;letter-spacing:0.12em;color:#5F6268">BACK</div>
<div style="font-size:16px;font-weight:700;line-height:1.2;margin-top:3px">Previous field</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":500}}'>

</html>
